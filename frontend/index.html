<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GI·MIS — General Insurance Policy MIS</title>
    <meta name="description" content="General insurance MIS portal: upload policy documents, AI OCR extraction, verification workflow and CSV/Excel MIS reports." />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <script>
      // After a redeploy, a cached page can point at old app files that no longer exist (blank page).
      // If an app script/stylesheet fails to load, reload once with a cache-busting URL to fetch the new version.
      (function () {
        var KEY = "gimis-stale-reload";
        function recover() {
          var last = Number(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 30000) return; // at most once per 30 s — never loop
          sessionStorage.setItem(KEY, String(Date.now()));
          var u = new URL(location.href);
          u.searchParams.set("v", String(Date.now()));
          location.replace(u.toString());
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK") && /\/assets\//.test(t.src || t.href || "")) recover();
        }, true);
        window.addEventListener("vite:preloadError", recover);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
